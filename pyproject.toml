[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-pipeline"
dynamic = ["version"]
description = "迹线统计分析与可视化工具"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "Pillow>=9.0",
    "scipy>=1.10",
    "shapely>=2.0",
    "pywebview>=5.0",
    "python-docx>=1.0",
    "reportlab>=4.0",
    "tqdm>=4.67",
    "xlrd>=2.0",
]

[project.scripts]
trace-pipeline = "trace_pipeline.cli.main:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "coverage>=7.5",
]

[tool.ruff]
target-version = "py310"
line-length = 100
lint.select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true

[tool.coverage.run]
source = ["trace_pipeline"]
omit = ["tests/*"]

[tool.setuptools.packages.find]
include = ["trace_pipeline*", "backend*"]

[tool.setuptools.dynamic]
version = {attr = "trace_pipeline.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
